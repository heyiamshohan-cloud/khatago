name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build and publish the release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      # Signing is only performed when every secret is present; otherwise an
      # unsigned release APK is built so the pipeline still produces an artifact.
      - name: Decode keystore (when configured)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          HAS_KEYSTORE: ${{ secrets.KHATAGO_KEYSTORE_BASE64 != '' }}
          KEYSTORE_BASE64: ${{ secrets.KHATAGO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/khatago.jks"
          echo "KHATAGO_STORE_FILE=$RUNNER_TEMP/khatago.jks" >> "$GITHUB_ENV"
          echo "KHATAGO_STORE_PASSWORD=${{ secrets.KHATAGO_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KHATAGO_KEY_ALIAS=${{ secrets.KHATAGO_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KHATAGO_KEY_PASSWORD=${{ secrets.KHATAGO_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Show APK permissions
        run: |
          ls -la app/build/outputs/apk/release/
          "$ANDROID_HOME/build-tools/"*/aapt2 dump permissions app/build/outputs/apk/release/*.apk || true

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          name: KhataGo ${{ github.ref_name }}
          body: |
            KhataGo ${{ github.ref_name }} — offline-first, free forever.

            See README.md for the full feature list and RELEASE.md for what was
            verified in this build.
          draft: false

