# KhataGo — Gradle build configuration
org.gradle.jvmargs=-Xmx3072m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=true

kotlin.code.style=official
kotlin.incremental=true

# KhataGo — raise Gradle's HTTP timeouts; the default 30s read timeout makes
# dependency resolution fail intermittently on hosted CI runners.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
